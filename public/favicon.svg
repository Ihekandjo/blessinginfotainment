<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blessing Infotainment">
  <defs>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#FBBF49"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#05091A"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#sun)" stroke-width="2" opacity="0.85"/>
  <text
    x="32"
    y="40"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="34"
    font-weight="800"
    fill="url(#sun)"
    filter="url(#glow)"
  >B</text>
  <circle cx="48" cy="17" r="5" fill="#22C58B"/>
</svg>
